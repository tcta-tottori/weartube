name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # 既定の "tools platform-tools" は廃止済みの tools を含み sdkmanager が失敗するので明示する
          packages: platform-tools

      - name: 必要な SDK を入れる
        run: |
          for p in "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"; do
            yes | sdkmanager "$p" >/dev/null 2>&1 && echo "installed: $p" || echo "skipped: $p"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Wear OS APK
        # YouTube Data API のキーはリポジトリの secret から BuildConfig に入れる（無ければ空＝設定画面で入力）
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew :app:assembleDebug

      - name: APK をまとめる
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/weartube-wear-debug.apk
          ls -la artifacts

      - name: APK をアップロード
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weartube-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # 時計へ adb でそのまま入れられるよう、開発版リリースにも APK を置く
      - name: 開発版リリースを更新
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev artifacts/*.apk \
            --target "$GITHUB_SHA" \
            --title "WearTube 開発版" \
            --prerelease \
            --notes "コミット ${GITHUB_SHA} の debug ビルド。ビルド番号 ${GITHUB_RUN_NUMBER}。

          - weartube-wear-debug.apk — Wear OS（Pixel Watch）用

          インストール: 時計の開発者向けオプションで ADB デバッグと無線デバッグを有効にし、
          adb pair / adb connect で時計につないでから adb install -r weartube-wear-debug.apk を実行する。"

      - name: レポートをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          retention-days: 7
